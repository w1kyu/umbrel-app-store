manifestVersion: 1.1
id: w1kyu-easyarr
storage:
  dataRoot: data
category: media
name: EasyArr
icon: https://raw.githubusercontent.com/w1kyu/easyarr/main/assets/icon.svg
version: '0.0.5'
tagline: Your own Netflix-style media setup, wired up for you
description: >-
  ⚠️ PREVIEW — not ready for everyday use yet. This early build installs all services, but the
  setup wizard is still being built (first 5 steps so far) and the apps aren't connected to each
  other yet.


  EasyArr sets up a complete media automation stack on your Umbrel and connects everything for
  you: request a movie, show or album, and it gets found, downloaded through a VPN, organised,
  given subtitles and shows up in Jellyfin automatically.


  Included: Sonarr (TV), Radarr (movies), Lidarr (music), Prowlarr (indexers), qBittorrent
  (torrents), SABnzbd (Usenet), Bazarr (subtitles), Jellyfin (watch), Jellyseerr (requests),
  plus FlareSolverr, Recyclarr, Unpackerr and Cleanuparr working in the background.


  All searching and downloading goes through a VPN with a kill switch. Your files live in the
  "EasyArr" folder in Files.


  Jellyfin opens on port 39096 and the request page on port 39055 of your Umbrel.
releaseNotes: >-
  Fix for the VPN connection: when the VPN reconnected (for example after switching servers), old
  firewall entries were left behind and piled up. They are now cleaned up properly. The kill switch
  works exactly as before — nothing is ever sent without the VPN.

developer: w1kyu
website: https://github.com/w1kyu/easyarr
dependencies: []
repo: https://github.com/w1kyu/easyarr
support: https://github.com/w1kyu/easyarr/issues

port: 39000
gallery: []
path: ''

defaultUsername: ''
defaultPassword: ''
permissions:
  - GPU
backupIgnore:
  - data/jellyfin/cache/*
  - data/jellyfin/log/*

submitter: w1kyu
submission: https://github.com/w1kyu/easyarr
