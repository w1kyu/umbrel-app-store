      start_period: 60s

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.8.1@sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9
    network_mode: 'service:vpn'
    user: '1000:1000'
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
      vpn:
        condition: service_started
    environment:
      TZ: 'Etc/UTC'
    volumes:
      - ${APP_DATA_DIR}/data/recyclarr:/config

  unpackerr:
    image: ghcr.io/unpackerr/unpackerr:v1.0.1@sha256:22b4693fbeaae4bd927905d63b59b8f67b4a1446682d965ac876c61a48976658
    network_mode: 'service:vpn'
    user: '1000:1000'
    restart: on-failure
    depends_on:
