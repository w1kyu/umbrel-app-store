      TZ: 'Etc/UTC'
      PORT: '11011'
    volumes:
      - ${APP_DATA_DIR}/data/cleanuparr:/config
      - ${UMBREL_ROOT}/data/storage/EasyArr:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost:11011/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Outside the VPN (D-003): media streaming must stay reachable on the LAN.
  jellyfin:
    image: linuxserver/jellyfin:version-12.4ubu2604@sha256:3894d9eae88418d3cf9ac6349392d2c4dad818365a59565d19edc38098897044
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      PUID: '1000'
      PGID: '1000'
      UMASK: '002'
      TZ: 'Etc/UTC'
    volumes:
      - ${APP_DATA_DIR}/data/jellyfin:/config
      - ${UMBREL_ROOT}/data/storage/EasyArr:/data
    ports:
      - '39096:8096'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost:8096/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  jellyseerr:
