  bazarr:
    image: linuxserver/bazarr:1.6.2@sha256:9a625883f054e722795affe5e3ca71057e6ed817ecdf99f4a99624346fcc509c
    network_mode: 'service:vpn'
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
      vpn:
        condition: service_healthy
    environment:
      PUID: '1000'
      PGID: '1000'
      UMASK: '002'
      TZ: 'Etc/UTC'
    volumes:
      - ${APP_DATA_DIR}/data/bazarr:/config
      - ${UMBREL_ROOT}/data/storage/EasyArr:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://localhost:6767/ || exit 1']
