# EasyArr — Umbrel app definition (SPEC §3, §5, §6, §19).
#
# Layout. The VPN-side services share the `vpn` container's network namespace
# (network_mode: "service:vpn"), so they talk to each other via localhost:<port> and are
# reached from outside via the container name w1kyu-easyarr_vpn_1:<port>. Internal ports
# must therefore never collide (see SPEC §3).
#
# The `vpn` service is EasyArr's VPN image (Gluetun + wrapper, D-040): its kill switch blocks all
# internet traffic of these services whenever the VPN isn't connected, including before the user
# has set one up. The services start only once the kill switch is in place (service_healthy).
services:
  app_proxy:
    environment:
      APP_HOST: w1kyu-easyarr_dashboard_1
      APP_PORT: 3000

  # One-shot (SPEC §7.4): /data tree, API keys, minimal service configs. Idempotent (D-031).
  init:
    image: ghcr.io/w1kyu/easyarr:sha-19fe549@sha256:c679f7b8b53208729361e8cd830b154772d532959a86fb1adca3fd8cb09f490f
    user: '0:0'
    command: ['init']
    restart: on-failure
    environment:
      NETWORK_IP: ${NETWORK_IP}
      PUID: '1000'
      PGID: '1000'
    volumes:
      - ${UMBREL_ROOT}/data/storage/EasyArr:/data
      - ${APP_DATA_DIR}/data:/appdata

  # Dashboard + setup wizard.
  dashboard:
    image: ghcr.io/w1kyu/easyarr:sha-19fe549@sha256:c679f7b8b53208729361e8cd830b154772d532959a86fb1adca3fd8cb09f490f
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      TZ: 'Etc/UTC'
      # Umbrel's app gateway is NETWORK_IP + 1; only it (and loopback) may use the API (D-041).
      NETWORK_IP: ${NETWORK_IP}
    volumes:
      - ${APP_DATA_DIR}/data/easyarr:/easyarr
      # VPN settings for the wrapper + its status and log (D-041).
      - ${APP_DATA_DIR}/data/vpn:/vpn
      # Read-only: the system check measures free space here (later: disk status on the dashboard).
      - ${UMBREL_ROOT}/data/storage/EasyArr:/data:ro

  # Owns the network namespace for every download/search service (SPEC §5).
  vpn:
    image: ghcr.io/w1kyu/easyarr-vpn:sha-bbccd9c@sha256:1df456259646ae2dc1ebc787b59b010eae4ff72c12e7f209740a02d43652d092
    restart: on-failure
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: 'Etc/UTC'
      # VPN settings come from the dashboard (easyarr/vpn.env), never from here (D-041).
      # Let VPN-side apps reach other containers on Umbrel's Docker network.
      FIREWALL_OUTBOUND_SUBNETS: '${NETWORK_IP}/16'
      UPDATER_PERIOD: '0'
      VERSION_INFORMATION: 'off'
    volumes:
      - ${APP_DATA_DIR}/data/vpn:/gluetun
    # Healthy = kill switch in place, not "VPN connected" (D-040). Same as the image's HEALTHCHECK.
    healthcheck:
      test: ['CMD', '/easyarr/healthcheck.sh']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  qbittorrent:
    image: linuxserver/qbittorrent:5.3.0@sha256:75ecbb1c89ab7b0a21c4bde40b4820e4f1649d2d56d83b91913422155e8d2a5f
    network_mode: 'service:vpn'
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
      vpn:
        condition: service_healthy
    environment:
      PUID: '1000'
      PGID: '1000'
      UMASK: '002'
      TZ: 'Etc/UTC'
      WEBUI_PORT: '8090'
      TORRENTING_PORT: '6881'
    volumes:
      - ${APP_DATA_DIR}/data/qbittorrent:/config
      - ${UMBREL_ROOT}/data/storage/EasyArr:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://localhost:8090/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  sabnzbd:
